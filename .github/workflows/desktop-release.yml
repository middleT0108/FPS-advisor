name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore desktop/FpsAdvisor.sln

      - name: Build & Publish Desktop App
        run: >
          dotnet publish desktop/src/FpsAdvisor.Wpf/FpsAdvisor.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o ./dist/desktop

      - name: Zip Release Package
        run: Compress-Archive -Path ./dist/desktop/* -DestinationPath ./FpsAdvisor-Desktop-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FpsAdvisor-Desktop-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
